name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libxml2 on Linux (required by augur binary)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::warning::apt-get not found; skipping libxml2 install"
            exit 0
          fi
          set -euo pipefail
          # Check if libxml2.so.2 is available
          if ldconfig -p 2>/dev/null | grep -qE "libxml2\.so\.2"; then
            echo "libxml2.so.2 is already available"
            exit 0
          fi
          # Ubuntu 25.10+ and 26.04+ ship libxml2.so.16 instead of libxml2.so.2
          # The augur binary was compiled against libxml2.so.2 and cannot find it.
          # Install libxml2-16 to get libxml2.so.16 and create a symlink for compatibility.
          # Note: A symlink may not work because the SONAME (libxml2.so.2) is embedded in the binary.
          # If the symlink fails, the augur binary will still fail with the same error.
          echo "Installing libxml2-16 and attempting symlink for libxml2.so.2 compatibility..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-16
          # Try to create symlink - if it fails, the augur binary will still fail
          # This is a best-effort approach; the proper fix would be to rebuild augur against libxml2-16
          if sudo ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so.16 /usr/lib/x86_64-linux-gnu/libxml2.so.2 2>/dev/null; then
            echo "Symlink created successfully. augur may work if it uses dlopen."
          else
            echo "Warning: Could not create symlink. augur will likely fail with libxml2.so.2 error."
            echo "The proper fix is to rebuild augur against libxml2-16 on Ubuntu 25.10+."
          fi
          echo "libxml2-16 installed."

      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        with:
          specsync-version: "6.1.0"

      - name: Check managed agent rules
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
          grep -q "CorvidLabs trust toolchain: END" AGENTS.md
