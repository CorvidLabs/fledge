name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libxml2 on Linux (required by augur binary)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::warning::apt-get not found; skipping libxml2 install"
            exit 0
          fi
          set -euo pipefail
          # Check if libxml2 is already available
          if ldconfig -p | grep -q libxml2; then
            echo "libxml2 is already installed"
            exit 0
          fi
          echo "Installing libxml2..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev
          echo "libxml2 installed successfully."

      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        with:
          specsync-version: "6.1.0"

      - name: Check managed agent rules
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
          grep -q "CorvidLabs trust toolchain: END" AGENTS.md
