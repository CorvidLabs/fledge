name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@e0272543ad5c88ec75cea1e606cc2efa552af25b # v1.2.0-rc.4

      - name: Check managed agent rules
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
          grep -q "CorvidLabs trust toolchain: END" AGENTS.md
