name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libxml2 on Linux (required by augur binary)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::warning::apt-get not found; skipping libxml2 install"
            exit 0
          fi
          set -euo pipefail
          # augur is dynamically linked against libxml2.so.2.
          # Ubuntu 25.10+ (which ubuntu-latest is migrating to) only provides libxml2.so.16.
          # The augur binary needs to be rebuilt against libxml2-16 to run on these runners.
          # Reference: https://github.com/CorvidLabs/augur/issues/57
          echo "::warning::augur is dynamically linked against libxml2.so.2"
          echo "::warning::Ubuntu 25.10+ only provides libxml2.so.16"
          echo "::warning::The augur binary needs to be rebuilt against libxml2-16"
          echo "::warning::Track progress at https://github.com/CorvidLabs/augur/issues/57"
          exit 1
      - name: Install libxml2-16 for compatibility (temporary workaround)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This is a temporary workaround. The proper fix is to rebuild augur against libxml2-16.
          # A symlink from libxml2.so.16 to libxml2.so.2 does not work because the SONAME is
          # embedded in the binary at compile time.
          echo "::warning::Temporary workaround: installing libxml2-16"
          echo "::warning::Note: A symlink won't work because the SONAME is embedded in the binary"
          echo "::warning::The proper fix is to rebuild augur against libxml2-16"
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::warning::apt-get not found; skipping libxml2 install"
            exit 0
          fi
          set -euo pipefail
          # Check if libxml2.so.2 is available (old Ubuntu with libxml2.so.2)
          if ldconfig -p 2>/dev/null | grep -qE "libxml2\.so\.2"; then
            echo "libxml2.so.2 is already available"
            exit 0
          fi
          echo "Installing libxml2-16..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-16
          echo "libxml2-16 installed. augur will likely fail with libxml2.so.2 error."
          echo "The proper fix is to rebuild augur against libxml2-16 on Ubuntu 25.10+."
          exit 1

      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        with:
          specsync-version: "6.1.0"

      - name: Check managed agent rules
        run: |
          grep -q "CorvidLabs trust toolchain: BEGIN" AGENTS.md
          grep -q "CorvidLabs trust toolchain: END" AGENTS.md
