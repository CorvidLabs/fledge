name: Test Action

# Exercises action.yml itself (the root-level composite "Setup Fledge" action),
# not the fledge binary's own test suite (that's ci.yml). This action exists
# because a silent break in the curl-based install workaround cost
# CorvidLabs/rune several CI runs, so it is covered on every PR and on main.
# See AGENTS.md and action.yml.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    name: install (${{ matrix.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [v1.7.2, latest]
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify outputs
        shell: bash
        env:
          REQUESTED: ${{ matrix.version }}
          GOT_VERSION: ${{ steps.setup.outputs.version }}
          GOT_PATH: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "$GOT_VERSION" ]; then
            echo "::error::outputs.version is empty" >&2
            exit 1
          fi
          if [ -z "$GOT_PATH" ]; then
            echo "::error::outputs.path is empty" >&2
            exit 1
          fi

          # A pinned version must round-trip unchanged; "latest" must resolve
          # to a real vX.Y.Z tag rather than passing the literal through.
          if [ "$REQUESTED" != "latest" ] && [ "$GOT_VERSION" != "$REQUESTED" ]; then
            echo "::error::pinned version ${REQUESTED} but outputs.version was ${GOT_VERSION}" >&2
            exit 1
          fi

          "$GOT_PATH" --version
          command -v fledge

  refuses-unsafe-install:
    name: refuses unsafe and unverifiable installs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # curl normalizes dot segments before sending, so an unvalidated `..`
      # here would pull the binary from a different repo entirely — and the
      # action installs it 0755 and runs it.
      - id: traversal
        uses: ./
        continue-on-error: true
        with:
          version: ../../../octocat/Hello-World/releases/download/v1

      # A newline in version would pass a line-oriented grep allowlist (one
      # line matches) and then forge an extra $GITHUB_OUTPUT line via
      # `echo "version=${version}" >> ...`. Same injection class as
      # install-dir CR/LF, so it must be refused at the boundary.
      - id: multiline-version
        uses: ./
        continue-on-error: true
        with:
          version: |
            v1.7.2
            extra=injected

      # A quote + newline in token used to terminate the
      # `header = "Authorization: Bearer …"` value in the curl --config stream,
      # after which the rest of the token was parsed as further curl
      # directives. This is the reviewer's scenario, on the path that actually
      # uses the token.
      #
      # On its own it is a weak assertion, and it is kept honest about that:
      # before the boundary check existed this step ALSO ended in `failure`,
      # because the directive the token injected pointed curl at a host that
      # does not resolve. A step that fails for the attacker's reason and a
      # step that fails because the input was refused are indistinguishable
      # from `outcome` alone. The case below is the one that tells them apart.
      - id: multiline-token
        uses: ./
        continue-on-error: true
        with:
          version: latest
          token: |
            ghp_ok"
            url = "https://example.invalid"

      # The discriminating regression: the same malicious token against a
      # *pinned* version, which never makes the API call the token is for.
      # If `token` is validated at the input boundary this is refused like any
      # other bad input. If it is only validated where it happens to be used,
      # the unused value sails past and the action installs successfully — so
      # this step's outcome flips from `failure` to `success` the moment the
      # boundary moves back inside the `latest` branch, which is exactly the
      # regression that shipped the vulnerability the first time.
      - id: pinned-bad-token
        uses: ./
        continue-on-error: true
        with:
          version: v1.7.2
          token: |
            ghp_ok"
            url = "https://example.invalid"

      # v0.5.0 really does publish fledge-linux-x86_64 with no .sha256 beside
      # it, which makes it a live fixture for the missing-sidecar path: the
      # install has to fail rather than quietly degrade to unverified.
      - id: unverifiable
        uses: ./
        continue-on-error: true
        with:
          version: v0.5.0

      - name: Confirm unsafe and unverifiable inputs were refused
        shell: bash
        env:
          TRAVERSAL: ${{ steps.traversal.outcome }}
          MULTILINE: ${{ steps.multiline-version.outcome }}
          MULTILINE_TOKEN: ${{ steps.multiline-token.outcome }}
          PINNED_BAD_TOKEN: ${{ steps.pinned-bad-token.outcome }}
          PINNED_BAD_TOKEN_VERSION: ${{ steps.pinned-bad-token.outputs.version }}
          PINNED_BAD_TOKEN_PATH: ${{ steps.pinned-bad-token.outputs.path }}
          UNVERIFIABLE: ${{ steps.unverifiable.outcome }}
        run: |
          set -euo pipefail
          failed=0

          if [ "$TRAVERSAL" != "failure" ]; then
            echo "::error::a version containing '..' was accepted; the version validation in action.yml has regressed" >&2
            failed=1
          fi
          if [ "$MULTILINE" != "failure" ]; then
            echo "::error::a version containing an embedded newline was accepted; CR/LF rejection or whole-string allowlist has regressed" >&2
            failed=1
          fi
          if [ "$MULTILINE_TOKEN" != "failure" ]; then
            echo "::error::a token containing quote+newline was accepted on the latest path; the token boundary check has regressed" >&2
            failed=1
          fi
          # Outcome and outputs are asserted separately: a refusal at the
          # boundary produces neither, while a token that slipped through
          # produces a complete, successful install.
          if [ "$PINNED_BAD_TOKEN" != "failure" ]; then
            echo "::error::a malicious token was accepted alongside a pinned version. token is no longer validated at the input boundary — only on the code path that consumes it — so an unused token reaches curl --config unchecked. See the token block in action.yml." >&2
            failed=1
          fi
          if [ -n "$PINNED_BAD_TOKEN_VERSION" ] || [ -n "$PINNED_BAD_TOKEN_PATH" ]; then
            echo "::error::the refused-token step still produced outputs (version='${PINNED_BAD_TOKEN_VERSION}' path='${PINNED_BAD_TOKEN_PATH}'); it installed before refusing" >&2
            failed=1
          fi
          if [ "$UNVERIFIABLE" != "failure" ]; then
            echo "::error::v0.5.0 publishes no .sha256 sidecar but installed anyway; checksum verification is no longer mandatory" >&2
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Confirmed: traversal version rejected, multiline version rejected, malicious token refused on both the latest and the pinned path, unverifiable release refused."

  windows-unsupported:
    name: windows is refused with a readable message
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # fledge does publish fledge-windows-x86_64.exe; this action just doesn't
      # install it yet. The message the action prints has to say that, not
      # imply the binary is missing.
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          version: v1.7.2

      - name: Confirm it failed for the right reason
        shell: bash
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the action to fail on windows-latest, but it succeeded. If Windows support was added, update this job and README.md." >&2
            exit 1
          fi
          echo "Confirmed: the action refuses Windows cleanly, as expected."
