name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --verbose --locked

  build:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: fledge-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: fledge-linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: fledge-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: fledge-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fledge-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Build (cross)
        if: matrix.cross == true
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/fledge.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/fledge ${{ matrix.artifact }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          for file in *; do
            [ -f "$file" ] || continue
            sha256sum "$file" | sed "s|.*/||" > "${file}.sha256"
          done
          cat *.sha256
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # Publishing is part of releasing, not a separate manual step. v1.7.1 and
  # v1.7.2 were both tagged, both ran this workflow green, and neither reached
  # crates.io — because no job here published them and nothing said so. A job
  # that fails loudly is the point: a release that did not publish is not a
  # finished release, and should be red rather than quietly incomplete.
  publish:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so this tag was built and released but NOT published to crates.io. Add the secret in Settings > Secrets and variables > Actions, then re-run this job." >&2
            exit 1
          fi
          cargo publish
      # Read the registry back. cargo publish exiting 0 is not proof the crate
      # is live: the index takes a moment, and a no-op publish also exits 0.
      # CorvidLabs/hi hit this exact failure at 0.2.4/0.2.5.
      - name: Verify the registry
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl -sS -A "fledge-release-check" \
              "https://crates.io/api/v1/crates/fledge" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['max_version'])")
            echo "attempt $attempt: crates.io reports $actual, tag is $expected"
            if [ "$actual" = "$expected" ]; then
              echo "crates.io confirms $actual"
              exit 0
            fi
            sleep 10
          done
          echo "::error::crates.io still reports $actual after publishing $expected. The publish did not take effect." >&2
          exit 1
