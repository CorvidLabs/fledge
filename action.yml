name: 'Setup Fledge'
description: 'Install the fledge CLI and put it on PATH.'
branding:
  icon: 'feather'
  color: 'purple'

inputs:
  version:
    description: >-
      Release tag to install, such as v1.7.2, or "latest". Pin it in CI: a
      concrete tag downloads the release asset directly and makes no API call,
      while "latest" has to ask the API which tag that is. Anything other than
      a release tag or "latest" is rejected — the value reaches a download URL.
    required: false
    default: 'latest'
  token:
    description: >-
      Token used only when resolving "latest". Without one that lookup is
      unauthenticated and rate-limited per IP, which is shared between runners
      — the failure mode is an intermittent "could not determine latest
      version" that looks like a broken build.
    required: false
    default: ${{ github.token }}
  install-dir:
    description: 'Directory to install into. Added to PATH.'
    required: false
    default: ''

outputs:
  version:
    description: 'The release tag that was installed.'
    value: ${{ steps.install.outputs.version }}
  path:
    description: 'Full path to the installed binary.'
    value: ${{ steps.install.outputs.path }}

runs:
  using: 'composite'
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        set -euo pipefail

        repo="CorvidLabs/fledge"

        # Whole-string match (not line-oriented grep): a newline-containing
        # value must not pass just because one of its lines is a valid tag —
        # `echo "version=${version}" >> $GITHUB_OUTPUT` would otherwise forge
        # extra output lines the same way a newline in install-dir forges
        # $GITHUB_PATH / $GITHUB_OUTPUT.
        valid_version() {
          [[ $1 =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
        }

        # GitHub tokens are opaque. When non-empty they are interpolated into a
        # curl --config line (`header = "Authorization: Bearer …"`). A quote
        # plus CR/LF can terminate that string and inject further curl
        # directives (another URL, upload-file, …) — same threat model as the
        # version/$GITHUB_OUTPUT boundary. Allow only a safe charset.
        valid_token() {
          [[ $1 =~ ^[A-Za-z0-9._-]+$ ]]
        }

        # `version` ends up in a download URL, and curl resolves dot segments
        # before sending, so a `..` in it escapes the repo namespace entirely —
        # and whatever binary lands is then installed 0755 and executed. A
        # consumer keying this off a branch name or PR title in a
        # pull_request_target workflow is the ordinary way untrusted data gets
        # here, so validate at the boundary instead of trusting every caller.
        # CR/LF are rejected the same way as install-dir: they forge extra
        # $GITHUB_OUTPUT lines via `echo "version=${version}" >> ...`.
        version="$INPUT_VERSION"
        case "$version" in
          *$'\n'* | *$'\r'*)
            echo "::error::version must not contain line breaks." >&2
            exit 1
            ;;
        esac
        if [ "$version" != "latest" ] && ! valid_version "$version"; then
          echo "::error::Invalid version '${version}'. Expected a release tag such as v1.7.2, or 'latest'." >&2
          exit 1
        fi

        # Token is optional (pinned tags make no API call). When present it
        # must be safe to embed in curl --config syntax — reject CR/LF and
        # metacharacters before any network use.
        if [ -n "${INPUT_TOKEN:-}" ]; then
          case "$INPUT_TOKEN" in
            *$'\n'* | *$'\r'*)
              echo "::error::token must not contain line breaks." >&2
              exit 1
              ;;
          esac
          if ! valid_token "$INPUT_TOKEN"; then
            echo "::error::token contains characters that cannot be safely passed through curl --config (allowed: letters, digits, . _ -)." >&2
            exit 1
          fi
        fi

        # Same class of problem, lower severity: a `..` segment writes the
        # binary outside the intended tree, and a newline injects extra lines
        # into $GITHUB_PATH / $GITHUB_OUTPUT.
        install_dir="${INPUT_INSTALL_DIR:-$HOME/.local/bin}"
        case "$install_dir" in
          *$'\n'* | *$'\r'*)
            echo "::error::install-dir must not contain line breaks." >&2
            exit 1
            ;;
        esac
        case "/${install_dir}/" in
          */../*)
            echo "::error::install-dir must not contain '..' path segments: ${install_dir}" >&2
            exit 1
            ;;
        esac

        case "$RUNNER_OS" in
          Linux) os="linux" ;;
          macOS) os="macos" ;;
          *)
            echo "::error::This action does not support ${RUNNER_OS} yet — it installs on Linux and macOS runners only. fledge itself does publish binaries for other platforms (fledge-windows-x86_64.exe among them); download one directly from https://github.com/${repo}/releases if you need it." >&2
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH" in
          X64) arch="x86_64" ;;
          ARM64) arch="aarch64" ;;
          *)
            echo "::error::fledge publishes no binary for $RUNNER_ARCH (x86_64 and aarch64 only)." >&2
            exit 1
            ;;
        esac

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        if [ "$version" = "latest" ]; then
          # Authenticated when a token is available, because the anonymous
          # limit is per IP and runners share them. The token goes in through a
          # stdin config file rather than argv so it never reaches the process
          # table.
          conf=(
            "silent"
            "show-error"
            "location"
            "fail"
            "retry = 3"
            'header = "Accept: application/vnd.github+json"'
            'header = "X-GitHub-Api-Version: 2022-11-28"'
          )
          # INPUT_TOKEN already passed valid_token / CR/LF checks above.
          if [ -n "${INPUT_TOKEN:-}" ]; then
            conf+=("header = \"Authorization: Bearer ${INPUT_TOKEN}\"")
          fi

          set +e
          status="$(printf '%s\n' "${conf[@]}" | curl --config - -w '%{http_code}' \
            -o "${tmp}/latest.json" \
            "https://api.github.com/repos/${repo}/releases/latest")"
          rc=$?
          set -e

          # Rate-limiting is the failure this action exists to remove, so name
          # it rather than collapsing every cause into one opaque message.
          if [ "$rc" -ne 0 ] || [ "$status" != "200" ]; then
            case "$status" in
              401 | 403) detail="the token was rejected or its rate limit is exhausted (HTTP ${status})" ;;
              429) detail="rate-limited (HTTP 429)" ;;
              000) detail="the request never completed — network or DNS failure (curl exit ${rc})" ;;
              *) detail="HTTP ${status}, curl exit ${rc}" ;;
            esac
            echo "::error::Could not resolve the latest fledge release: ${detail}. Pin \`version\` to a release tag instead — a pinned tag makes no API call at all." >&2
            exit 1
          fi

          version="$(jq -r '.tag_name // empty' < "${tmp}/latest.json")"
          # Same CR/LF + whole-string allowlist as the input path: an API
          # response must not be able to inject $GITHUB_OUTPUT lines either.
          case "$version" in
            *$'\n'* | *$'\r'*)
              echo "::error::The API returned a tag_name containing line breaks; refusing to use it. Pin \`version\` to a release tag instead." >&2
              exit 1
              ;;
          esac
          if [ -z "$version" ] || ! valid_version "$version"; then
            echo "::error::The API returned no usable tag_name for the latest release (got '${version}'). Pin \`version\` to a release tag instead." >&2
            exit 1
          fi
        fi

        asset="fledge-${os}-${arch}"
        base="https://github.com/${repo}/releases/download/${version}"

        if ! curl -fsSL --retry 3 --retry-all-errors "${base}/${asset}" -o "${tmp}/fledge"; then
          echo "::error::Failed to download ${asset} for ${version}. Check that the tag exists and publishes this asset: ${base}/${asset}" >&2
          exit 1
        fi

        # Verification is mandatory. Skipping it on a failed sidecar fetch
        # would let anyone able to fail one request downgrade the install to an
        # unverified one, and whoever can tamper with the binary can also block
        # its sidecar. `--retry 3` without `--retry-all-errors` retries the
        # transient statuses but not 404, so a genuinely absent sidecar fails
        # fast instead of burning the backoff.
        set +e
        sum_status="$(curl -fsSL --retry 3 -w '%{http_code}' \
          -o "${tmp}/fledge.sha256" "${base}/${asset}.sha256")"
        sum_rc=$?
        set -e

        if [ "$sum_rc" -ne 0 ] || [ "$sum_status" != "200" ]; then
          if [ "$sum_status" = "404" ]; then
            detail="no sidecar is published there — releases before v0.9.1 predate them"
          else
            detail="HTTP ${sum_status}, curl exit ${sum_rc}"
          fi
          echo "::error::Could not fetch the checksum for ${asset} at ${version} (${detail}): ${base}/${asset}.sha256. Refusing to install an unverified binary." >&2
          exit 1
        fi

        expected="$(cut -d' ' -f1 < "${tmp}/fledge.sha256")"
        if ! printf '%s' "$expected" | grep -Eq '^[0-9a-fA-F]{64}$'; then
          echo "::error::Malformed checksum sidecar for ${asset} at ${version}; expected a sha256 digest." >&2
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${tmp}/fledge" | cut -d' ' -f1)"
        else
          actual="$(shasum -a 256 "${tmp}/fledge" | cut -d' ' -f1)"
        fi
        if [ "$expected" != "$actual" ]; then
          echo "::error::Checksum mismatch for ${asset} at ${version}: expected ${expected}, got ${actual}." >&2
          exit 1
        fi

        mkdir -p "$install_dir"
        install -m 0755 "${tmp}/fledge" "${install_dir}/fledge"

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "path=${install_dir}/fledge" >> "$GITHUB_OUTPUT"
        echo "Installed fledge ${version} to ${install_dir}/fledge (sha256 verified)"

    - shell: bash
      run: fledge --version
